<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modo == 'crear'} ? 'Nuevo departamento' : 'Editar departamento'">Departamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <h4 th:text="${modo == 'crear'} ? 'Nuevo departamento' : 'Editar departamento'"></h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- La URL de destino cambia según si creamos o editamos -->
    <form th:object="${departamento}" method="post"
          th:action="${modo == 'crear'} ? @{/departamentos/guardar} : @{/departamentos/{id}/actualizar(id=${departamento.id})}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ubicación</label>
            <input type="text" th:field="*{ubicacion}" class="form-control"
                   th:classappend="${#fields.hasErrors('ubicacion')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{ubicacion}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Presupuesto (₡)</label>
            <input type="number" step="0.01" th:field="*{presupuesto}" class="form-control"
                   th:classappend="${#fields.hasErrors('presupuesto')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{presupuesto}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/departamentos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
