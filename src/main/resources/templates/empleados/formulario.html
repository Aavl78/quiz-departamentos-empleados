<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modo == 'crear'} ? 'Nuevo empleado' : 'Editar empleado'">Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <h4 th:text="${modo == 'crear'} ? 'Nuevo empleado' : 'Editar empleado'"></h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:object="${empleado}" method="post"
          th:action="${modo == 'crear'} ? @{/empleados/guardar} : @{/empleados/{id}/actualizar(id=${empleado.id})}">

        <div class="mb-3">
            <label class="form-label">Departamento</label>
            <select name="departamentoId" class="form-select" required>
                <option value="">-- Seleccione un departamento --</option>
                <option th:each="d : ${departamentos}"
                        th:value="${d.id}"
                        th:text="${d.nombre} + ' (disponible ₡' + ${#numbers.formatDecimal(d.disponible, 1, 'COMMA', 2, 'POINT')} + ')'"
                        th:selected="${d.id == departamentoId}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cédula (9 dígitos)</label>
            <input type="text" th:field="*{cedula}" class="form-control"
                   th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{cedula}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Puesto</label>
            <select th:field="*{puesto}" class="form-select"
                    th:classappend="${#fields.hasErrors('puesto')} ? 'is-invalid'">
                <option value="">-- Seleccione --</option>
                <option th:each="p : ${puestos}" th:value="${p}" th:text="${p.etiqueta}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{puesto}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Salario (₡)</label>
            <input type="number" step="0.01" th:field="*{salario}" class="form-control"
                   th:classappend="${#fields.hasErrors('salario')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{salario}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de ingreso</label>
            <input type="date" th:field="*{fechaIngreso}" class="form-control"
                   th:classappend="${#fields.hasErrors('fechaIngreso')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/empleados}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
