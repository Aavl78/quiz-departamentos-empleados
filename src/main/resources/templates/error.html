<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Página que reemplaza a la Whitelabel Error Page -->
<div class="container" style="max-width: 600px; margin-top: 10vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
            <h2 class="text-danger" th:text="'Error ' + ${status}">Error</h2>

            <p th:if="${status == 403}" class="lead">No tiene permisos para realizar esta acción.</p>
            <p th:if="${status == 404}" class="lead">La página que busca no existe.</p>
            <p th:if="${status != 403 and status != 404}" class="lead">Ocurrió un problema al procesar la solicitud.</p>

            <a th:href="@{/departamentos}" class="btn btn-primary">Volver al inicio</a>
        </div>
    </div>
</div>
</body>
</html>
