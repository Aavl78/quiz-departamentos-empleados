<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="d-flex align-items-center gap-3">
        <span class="navbar-brand">Gestión</span>
        <a class="nav-link text-white-50" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
        <a class="nav-link text-white" th:href="@{/departamentos}">Departamentos</a>
        <a class="nav-link text-white-50" th:href="@{/empleados}">Empleados</a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white">Hola, <b sec:authentication="name"></b></span>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm">Salir</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Lista de departamentos</h4>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/departamentos/nuevo}" class="btn btn-primary">+ Nuevo departamento</a>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nombre</th><th>Ubicación</th><th>Presupuesto</th>
            <th>Empleados</th><th>Planilla</th><th>Disponible</th>
            <th sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${departamentos}">
            <td th:text="${d.id}"></td>
            <td th:text="${d.nombre}"></td>
            <td th:text="${d.ubicacion}"></td>
            <td th:text="'₡' + ${#numbers.formatDecimal(d.presupuesto, 1, 'COMMA', 2, 'POINT')}"></td>
            <!-- Cantidad de empleados; al hacer clic muestra los empleados de ese departamento -->
            <td>
                <a th:href="@{/empleados(departamentoId=${d.id})}"
                   class="badge bg-primary text-decoration-none"
                   th:text="${#lists.size(d.empleados)}"></a>
            </td>
            <td th:text="'₡' + ${#numbers.formatDecimal(d.totalPlanilla, 1, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="'₡' + ${#numbers.formatDecimal(d.disponible, 1, 'COMMA', 2, 'POINT')}"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/empleados/nuevo(departamentoId=${d.id})}" class="btn btn-sm btn-success">+ Empleado</a>
                <a th:href="@{/departamentos/{id}/editar(id=${d.id})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/departamentos/{id}/eliminar(id=${d.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Desea eliminar este departamento?');">
                    <button class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(departamentos)}">
            <td colspan="8" class="text-center text-muted">No hay departamentos registrados</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
