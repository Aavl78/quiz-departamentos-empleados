<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="d-flex align-items-center gap-3">
        <span class="navbar-brand">Gestión</span>
        <a class="nav-link text-white" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
        <a class="nav-link text-white-50" th:href="@{/departamentos}">Departamentos</a>
        <a class="nav-link text-white-50" th:href="@{/empleados}">Empleados</a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white">Hola, <b sec:authentication="name"></b></span>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm">Salir</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Lista de usuarios</h4>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo usuario</a>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nombre</th><th>Username</th><th>Email</th><th>Rol</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td><span class="badge" th:classappend="${u.rol == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                      th:text="${u.rol}"></span></td>
            <td>
                <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Desea eliminar este usuario?');">
                    <button class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="6" class="text-center text-muted">No hay usuarios en el sistema</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
